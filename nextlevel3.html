<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cooking Level 3 - Knife Action</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
  body {
    margin: 0;
    background: #e0fff0;
    font-family: "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #game {
    width: 900px;
    height: 650px;
    background: #d0ffe8;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    padding: 15px;
    box-sizing: border-box;
  }

  #top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  #task-box {
    background: #4fcf7f;
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: bold;
    color: white;
    transition: background 0.3s;
  }

  #timer {
    background: #2fa65b;
    padding: 12px 20px;
    border-radius: 15px;
    color: white;
    font-weight: bold;
  }

  #kitchen {
    position: relative;
    height: 400px;
    background: linear-gradient(#d0ffd8, #b0ffc0);
    border-radius: 20px;
    margin-bottom: 10px;
  }

  #ingredients {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  .ingredient {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: white;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    user-select: none;
  }

  #sink {
    position: absolute;
    right: 50px;
    bottom: 50px;
    width: 120px;
    height: 80px;
    background: #4fcf7f;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  #knife {
    position: absolute;
    left: 50px;
    bottom: 50px;
    width: 100px;
    height: 40px;
    background: #ccc;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    user-select: none;
  }

  .cut {
    transform: rotate(-20deg) scale(0.9);
    transition: transform 0.2s;
    opacity: 0.7;
  }

  .washed {
    border: 3px solid #4fcf7f;
  }
</style>
</head>
<body>

<div id="game">
  <div id="top-bar">
    <div id="task-box">Step 1: Pick up the knife 🔪</div>
    <div id="timer">Time: 10</div>
  </div>

  <div id="kitchen">
    <div id="sink">Sink 💧</div>
    <div id="knife">🔪 Knife</div>

    <div id="ingredients">
      <div class="ingredient" id="carrot">🥕</div>
      <div class="ingredient" id="tomato">🍅</div>
      <div class="ingredient" id="onion">🧅</div>
    </div>
  </div>
</div>

<script>
const steps = [
  {id: "carrot", cut: false, washed: false},
  {id: "tomato", cut: false, washed: false},
  {id: "onion", cut: false, washed: false}
];

let stepIndex = 0;
let knifePicked = false;
let timeLeft = 10;
let timer;

const taskBox = document.getElementById("task-box");
const timerDisplay = document.getElementById("timer");
const sink = document.getElementById("sink");
const knife = document.getElementById("knife");
const ingredients = document.querySelectorAll(".ingredient");

function updateTask() {
  if(stepIndex < steps.length) {
    const current = steps[stepIndex];
    if(!knifePicked) {
      taskBox.innerText = "Step: Pick up the knife 🔪";
    } else if(!current.cut) {
      taskBox.innerText = `Step ${stepIndex+1}: Click the knife above the ${current.id} to cut it`;
    } else if(!current.washed) {
      taskBox.innerText = `Step ${stepIndex+1}: Wash the ${current.id} in the sink`;
    }
  }
}

// Pick up the knife
knife.addEventListener("click", () => {
  knifePicked = true;
  updateTask();
});

// Cutting logic
ingredients.forEach(item => {
  item.addEventListener("click", () => {
    const current = steps[stepIndex];
    if(knifePicked && item.id === current.id && !current.cut) {
      item.classList.add("cut");
      current.cut = true;
      updateTask();
    }
  });
});

// Washing logic
sink.addEventListener("click", () => {
  const current = steps[stepIndex];
  if(current.cut && !current.washed) {
    const elem = document.getElementById(current.id);
    elem.classList.add("washed");
    current.washed = true;
    stepIndex++;
    updateTask();
    checkCompletion();
  }
});

function checkCompletion() {
  if(stepIndex === steps.length) {
    clearInterval(timer);
    taskBox.innerText = "🎉 All vegetables cut and washed!";
    setTimeout(() => window.location.href="nextlevel4.html", 1500);
  }
}

function startTimer() {
  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.innerText = "Time: " + timeLeft;
    if(timeLeft <= 0) {
      clearInterval(timer);
      taskBox.innerText = "⏰ Time’s up! Restarting Level 3...";
      setTimeout(() => location.reload(), 1500);
    }
  }, 1000);
}

startTimer();
updateTask();
</script>

</body>
</html>
