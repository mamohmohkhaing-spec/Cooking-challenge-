<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cooking Level 4 - Eating Challenge</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
  body {
    margin: 0;
    background: #fff0e0;
    font-family: "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  #game {
    width: 900px;
    height: 650px;
    background: #ffe6cc;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    padding: 15px;
    box-sizing: border-box;
    position: relative;
  }

  #top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  #task-box {
    background: #ff8c4c;
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: bold;
    color: white;
  }

  #timer {
    background: #ff4c00;
    padding: 12px 20px;
    border-radius: 15px;
    color: white;
    font-weight: bold;
  }

  #table {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 150px;
    background: #d9773b;
    border-radius: 20px;
  }

  .plate {
    position: absolute;
    bottom: 90px;
    width: 100px;
    height: 100px;
    background: #fff5e6;
    border-radius: 50%;
    border: 4px solid #d9773b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    user-select: none;
    transition: transform 0.1s, opacity 0.3s;
  }

  #plate1 { left: 150px; }
  #plate2 { left: 400px; }
  #plate3 { left: 650px; }

  .eaten {
    opacity: 0;
    pointer-events: none;
  }

  /* Popup */
  #popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #ffeb3b;
    padding: 40px 60px;
    border-radius: 20px;
    font-size: 36px;
    font-weight: bold;
    color: #d9773b;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.5s ease;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="game">
  <div id="top-bar">
    <div id="task-box">Eat all the food!</div>
    <div id="timer">Time: 7</div>
  </div>

  <div id="table"></div>

  <div class="plate" id="plate1">🍽️</div>
  <div class="plate" id="plate2">🍽️</div>
  <div class="plate" id="plate3">🍽️</div>

  <!-- Popup -->
  <div id="popup">🎉 You won!</div>
</div>

<script>
const plates = [
  {id: "plate1", clicksNeeded: 3, clicks: 0},
  {id: "plate2", clicksNeeded: 9, clicks: 0},
  {id: "plate3", clicksNeeded: 12, clicks: 0}
];

let timeLeft = 7;
let timer;
const timerDisplay = document.getElementById("timer");
const taskBox = document.getElementById("task-box");
const popup = document.getElementById("popup");

// Plate clicking logic
plates.forEach(plate => {
  const el = document.getElementById(plate.id);
  el.addEventListener("click", () => {
    plate.clicks++;
    el.style.transform = `scale(${1 - plate.clicks / plate.clicksNeeded * 0.6})`;
    if(plate.clicks >= plate.clicksNeeded) {
      el.classList.add("eaten");
      checkCompletion();
    }
  });
});

function checkCompletion() {
  const allEaten = plates.every(p => p.clicks >= p.clicksNeeded);
  if(allEaten) {
    clearInterval(timer);
    taskBox.innerText = "🎉 All plates eaten!";

  
    popup.style.transform = "translate(-50%, -50%) scale(1)";

   
    setTimeout(() => {
      window.location.href = "nextlevel5.html";
    }, 1000);
  }
}

// Timer
function startTimer() {
  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.innerText = "Time: " + timeLeft;
    if(timeLeft <= 0) {
      clearInterval(timer);
      taskBox.innerText = "⏰ Time’s up! Restarting Level 4...";
      setTimeout(() => location.reload(), 1500);
    }
  }, 1000);
}

startTimer();
</script>

</body>
</html>
