<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cooking Level 5 - Ultimate Challenge</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: #ffe6f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  #game {
    width: 900px;
    height: 650px;
    background: #ffd1e8;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    padding: 15px;
    box-sizing: border-box;
    position: relative;
  }

  #top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  #task-box {
    background: #ff6fae;
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: bold;
    color: white;
  }

  #timer {
    background: #ff2979;
    padding: 12px 20px;
    border-radius: 15px;
    color: white;
    font-weight: bold;
  }

  #kitchen {
    position: relative;
    height: 450px;
    background: linear-gradient(#ffd1e8, #ffc0dc);
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .ingredient {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: white;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
    position: absolute;
    user-select: none;
    transition: transform 0.1s;
  }

  #knife, #lemon, #pan {
    position: absolute;
    cursor: pointer;
    user-select: none;
    font-size: 36px;
  }

  #knife { bottom: 50px; left: 50px; }
  #lemon { bottom: 50px; left: 150px; }
  #pan { bottom: 50px; left: 650px; width: 100px; height: 100px; background: #444; border-radius: 50%; border: 6px solid #222; display: flex; align-items:center; justify-content:center; font-size:36px; color:#fff; }

  #popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #ffeb3b;
    padding: 40px 60px;
    border-radius: 20px;
    font-size: 36px;
    font-weight: bold;
    color: #d9773b;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.5s ease;
    z-index: 100;
  }
</style>
</head>
<body>

<div id="game">
  <div id="top-bar">
    <div id="task-box">Memorize the sequence!</div>
    <div id="timer">Time: 10</div>
  </div>

  <div id="kitchen">
    <div id="knife">🔪</div>
    <div id="lemon">🍋</div>
    <div id="pan">🍳</div>
  </div>

  <!-- Popup -->
  <div id="popup">🎉 You won!</div>
</div>

<script>
let timeLeft = 10; // <-- updated timer
const timerDisplay = document.getElementById("timer");
const taskBox = document.getElementById("task-box");
const popup = document.getElementById("popup");

const knife = document.getElementById("knife");
const lemon = document.getElementById("lemon");
const pan = document.getElementById("pan");

// Ingredients and their actions
const ingredientsData = [
  {emoji:"🥕", action:"cut"},
  {emoji:"🍅", action:"cut"},
  {emoji:"🧅", action:"cut"},
  {emoji:"🍋", action:"squeeze"},
  {emoji:"🍄", action:"pan"}
];

// Randomize order
const sequence = ingredientsData.sort(() => Math.random()-0.5);
let currentStep = 0;
let holdingLemon = false;

// Display ingredients randomly on kitchen
sequence.forEach((item,i)=>{
  const div = document.createElement("div");
  div.className = "ingredient";
  div.id = "ing"+i;
  div.innerText = item.emoji;
  div.style.top = (50 + Math.random()*250) + "px";
  div.style.left = (100 + Math.random()*600) + "px";
  document.getElementById("kitchen").appendChild(div);
  item.element = div;
});

// Show memory sequence for 2 seconds
taskBox.innerText = "Memorize the sequence: " + sequence.map(i=>i.emoji + "→"+i.action).join(", ");
setTimeout(()=>{
  updateTask();
},2000);

function updateTask(){
  if(currentStep<sequence.length){
    const step = sequence[currentStep];
    taskBox.innerText = `Do action: ${step.action.toUpperCase()} ${step.emoji}`;
  }
}

// Knife click
knife.addEventListener("click", ()=>{
  const step = sequence[currentStep];
  if(step.action==="cut" && !step.done && step.element){
    step.done = true;
    step.element.style.opacity = 0.5;
    currentStep++;
    updateTask();
    checkWin();
  } else {
    failLevel();
  }
});

// Lemon click (must hold for 3 seconds)
lemon.addEventListener("mousedown", ()=>{
  const step = sequence[currentStep];
  if(step.action==="squeeze" && !step.done){
    holdingLemon = true;
    taskBox.innerText = `Squeezing ${step.emoji}...`;
    step.start = Date.now();
  } else {
    failLevel();
  }
});
lemon.addEventListener("mouseup", ()=>{
  const step = sequence[currentStep];
  if(step.action==="squeeze" && holdingLemon){
    holdingLemon = false;
    const held = (Date.now() - step.start)/1000;
    if(held>=3){
      step.done = true;
      step.element.style.opacity = 0.5;
      currentStep++;
      updateTask();
      checkWin();
    } else {
      failLevel();
    }
  }
});

// Pan click
pan.addEventListener("click", ()=>{
  const step = sequence[currentStep];
  if(step.action==="pan" && !step.done){
    step.done = true;
    step.element.style.opacity = 0.5;
    currentStep++;
    updateTask();
    checkWin();
  } else {
    failLevel();
  }
});

// Timer
const timer = setInterval(()=>{
  timeLeft--;
  timerDisplay.innerText = "Time: "+timeLeft;
  if(timeLeft<=0){
    clearInterval(timer);
    failLevel();
  }
},1000);

// Check win
function checkWin(){
  if(currentStep>=sequence.length){
    clearInterval(timer);
    popup.style.transform = "translate(-50%, -50%) scale(1)";
    taskBox.innerText = "🎉 All actions done!";
    setTimeout(()=>window.location.href="nextlevel6.html",2000);
  }
}

// Fail
function failLevel(){
  clearInterval(timer);
  taskBox.innerText = "❌ Wrong action! Restarting...";
  setTimeout(()=>location.reload(),1500);
}
</script>
</body>
</html>
