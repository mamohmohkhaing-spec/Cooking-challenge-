<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cooking Level 2</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
  body {
    margin: 0;
    background: #f0e6ff;
    font-family: "Poppins", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  #game {
    width: 900px;
    height: 650px;
    background: #e8dfff;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    padding: 15px;
    box-sizing: border-box;
  }

  #top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    align-items: center;
  }

  #task-box {
    background: #a77fff;
    padding: 12px 20px;
    border-radius: 15px;
    font-weight: bold;
    color: white;
    transition: background 0.3s;
  }

  #timer {
    background: #7f4fff;
    padding: 12px 20px;
    border-radius: 15px;
    color: white;
    font-weight: bold;
  }

  #kitchen {
    position: relative;
    height: 400px;
    background: linear-gradient(#e0cfff, #d0bfff);
    border-radius: 20px;
    margin-bottom: 10px;
  }

  #table {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 140px;
    background: #a77fff;
    border-radius: 0 0 20px 20px;
  }

  #pan {
    width: 200px;
    height: 120px;
    background: #555;
    border-radius: 0 0 100px 100px;
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid #222;
    overflow: hidden;
  }

  #pan::before {
    content: "";
    position: absolute;
    width: 140px;
    height: 20px;
    background: #333;
    top: -15px;
    left: 30px;
    border-radius: 20px;
  }

  #meal-fill {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: linear-gradient(#ffb347, #ffebcd);
    border-radius: 0 0 100px 100px;
    transition: height 0.5s;
  }

  #ingredients {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .ingredient {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    cursor: grab;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: white;
    box-shadow: 0 5px 10px rgba(0,0,0,0.2);
  }

  /* Lemon squeeze button */
  #squeeze-button {
    position: absolute;
    right: 30px;
    bottom: 150px;
    display: none;
    padding: 12px 18px;
    font-size: 18px;
    border-radius: 12px;
    background: #fff176;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    user-select: none;
  }
</style>
</head>
<body>

<div id="game">

  <div id="top-bar">
    <div id="task-box">Step 1: Add Mushroom 🍄</div>
    <div id="timer">Time: 25</div>
  </div>

  <div id="kitchen">
    <div id="pan">
      <div id="meal-fill"></div>
    </div>
    <div id="table"></div>

    <!-- Lemon squeeze button -->
    <button id="squeeze-button">Squeeze Lemon 🍋</button>
  </div>

  <div id="ingredients">
    <div class="ingredient" draggable="true" id="mushroom">🍄</div>
    <div class="ingredient" draggable="true" id="tomato">🍅</div>
    <div class="ingredient" draggable="true" id="onion">🧅</div>
    <div class="ingredient" draggable="true" id="carrot">🥕</div>
    <div class="ingredient" draggable="true" id="lemon">🍋</div>
  </div>

</div>

<script>
const recipe = [
  {id: "mushroom", action: "drop"}, 
  {id: "tomato", action: "drop"}, 
  {id: "onion", action: "drop"}, 
  {id: "carrot", action: "drop"}, 
  {id: "lemon", action: "squeeze"}
];

let step = 0;
let timeLeft = 25;
let timer;
let lemonHoldTime = 0;
let lemonInterval = null;

const taskBox = document.getElementById("task-box");
const timerDisplay = document.getElementById("timer");
const mealFill = document.getElementById("meal-fill");
const ingredients = document.querySelectorAll(".ingredient");
const squeezeButton = document.getElementById("squeeze-button");

// Drag start
ingredients.forEach(item => {
  item.addEventListener("dragstart", e => {
    e.dataTransfer.setData("id", e.target.id);
  });
});

// Allow drop
const pan = document.getElementById("pan");
pan.addEventListener("dragover", e => e.preventDefault());

// Drop logic
pan.addEventListener("drop", e => {
  const id = e.dataTransfer.getData("id");
  const currentStep = recipe[step];

  if(currentStep.action === "drop" && id === currentStep.id) {
    const ingredientEl = document.getElementById(id);
    ingredientEl.style.visibility = "hidden";
    ingredientEl.draggable = false;

    const fillPercentage = ((step + 1) / recipe.length) * 100;
    mealFill.style.height = fillPercentage + "%";

    step++;
    updateTask();
    checkNextStep();
  } else {
    showMessage("❌ Wrong ingredient!");
  }
});

function updateTask() {
  if(step < recipe.length) {
    const currentStep = recipe[step];
    if(currentStep.action === "drop") {
      taskBox.innerText = `Step ${step+1}: Add ${capitalize(currentStep.id)}`;
      squeezeButton.style.display = "none";
    } else if(currentStep.action === "squeeze") {
      taskBox.innerText = `Step ${step+1}: Hold the button for 5 seconds to squeeze lemon 🍋`;
      squeezeButton.style.display = "block";
    }
  }
}

// Button click & hold for lemon
squeezeButton.addEventListener("mousedown", () => {
  lemonHoldTime = 0;
  lemonInterval = setInterval(() => {
    lemonHoldTime += 0.1;
    if(lemonHoldTime >= 5) {
      clearInterval(lemonInterval);
      completeLemon();
    }
  }, 100);
});

squeezeButton.addEventListener("mouseup", () => clearInterval(lemonInterval));
squeezeButton.addEventListener("mouseleave", () => clearInterval(lemonInterval));

function completeLemon() {
  squeezeButton.style.display = "none";
  const lemonEl = document.getElementById("lemon");
  lemonEl.style.visibility = "hidden";

  mealFill.style.height = "100%";
  step++;
  checkNextStep();
}

function checkNextStep() {
  if(step === recipe.length) {
    clearInterval(timer);
    taskBox.innerText = "🎉 Dish completed! The meal is ready!";
    setTimeout(() => window.location.href = "nextlevel3.html", 1500);
  } else {
    updateTask();
  }
}

function startTimer() {
  timer = setInterval(() => {
    timeLeft--;
    timerDisplay.innerText = "Time: " + timeLeft;

    if(timeLeft <= 0) {
      clearInterval(timer);
      showMessage("⏰ Time’s up! Restarting level...");
      setTimeout(() => location.reload(), 1500);
    }
  }, 1000);
}

function capitalize(word) {
  return word.charAt(0).toUpperCase() + word.slice(1);
}

function showMessage(text) {
  taskBox.innerText = text;
  taskBox.style.background = "#ff4c4c";
  setTimeout(() => {
    taskBox.style.background = "#a77fff";
    updateTask();
  }, 1000);
}

startTimer();
updateTask();
</script>

</body>
</html>
